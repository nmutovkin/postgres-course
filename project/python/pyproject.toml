[project]
name = "bazaar"
version = "0.28.0"
description = "Bazaar marketplace: the Python side of the PostgreSQL course (modules 22-28)"
readme = "README.md"
requires-python = ">=3.12"
# Each module of Part IV adds what it needs here:
#   22 psycopg 3 (sync data access)        23 asyncpg + async psycopg (async layer, worker)
#   24-25 sqlalchemy                        26 alembic
#   27 production extras                    28 fastapi + uvicorn
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",  # modules 24-25; [asyncio] pulls in greenlet
    "alembic>=1.13",  # module 26
    "fastapi>=0.140",  # module 28: the HTTP service (tested with 0.143; uses Depends(scope=))
    "uvicorn[standard]>=0.30",  # module 28: the ASGI server (uvloop, httptools)
]

[project.optional-dependencies]
# module 27: OpenTelemetry tracing (bazaar.observability.setup_tracing)
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pydantic>=2",  # module 22 row-factory examples; the module 28 API uses it too (via fastapi)
    "pytest-xdist>=3.6",  # module 27: pytest -n 4
    "testcontainers[postgres]>=4.8",  # module 27: tests/test_containers.py (opt-in)
    "bazaar[otel]",  # module 27: the tracing test
    "httpx>=0.27",  # module 28: API tests (ASGITransport)
    "aiohttp>=3.9",  # module 28: the load generator (modules/28-capstone/examples)
]

[project.scripts]
bazaar-worker = "bazaar.worker:main"
bazaar-relay = "bazaar.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: takes more than a couple of seconds (deselect with -m 'not slow')",
    "docker: starts a PostgreSQL container with testcontainers (BAZAAR_TEST_DOCKER=1)",
    "migrated: needs the database at Alembic head (module 26+); skipped when it is not",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S608"]

[tool.ruff.lint.per-file-ignores]
# DDL helpers and revisions compose SQL from identifiers written in the revision
# files themselves (never from user input), and DDL cannot take bind parameters.
"src/bazaar/migrate.py" = ["S608"]
"migrations/**" = ["S608"]
