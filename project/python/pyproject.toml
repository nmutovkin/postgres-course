[project]
name = "bazaar"
version = "0.23.0"
description = "Bazaar marketplace: the Python side of the PostgreSQL course (modules 22-28)"
readme = "README.md"
requires-python = ">=3.12"
# Each module of Part IV adds what it needs here:
#   22 psycopg 3 (sync data access)        23 asyncpg + async psycopg (async layer, worker)
#   24-25 sqlalchemy                        26 alembic
#   27 production extras                    28 fastapi + uvicorn
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pydantic>=2",  # only for the row-factory examples of module 22
]

[project.scripts]
bazaar-worker = "bazaar.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: takes more than a couple of seconds (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S608"]
