# Alembic configuration for the Bazaar database (module 26).
#
#   cd project/python
#   alembic current                  # which revision is the database at?
#   alembic upgrade head             # apply everything that is missing
#   alembic upgrade head --sql       # print the SQL instead (offline mode, for review)
#   alembic -x lock_timeout=5s upgrade head
#   alembic revision -m "add x" --rev-id 2605      # a new, empty revision
#   alembic revision --autogenerate -m "..."         # a draft from the metadata diff (review it!)
#
# The database URL is NOT in this file: env.py reads BAZAAR_MIGRATION_DSN (or
# BAZAAR_DSN) through bazaar.config, so secrets stay in the environment and the
# migrations hit the same database as the application and the tests.

[alembic]
script_location = %(here)s/migrations

# Revision files are named by our own ids (--rev-id 2601 ...): the module that
# introduced them, then a sequence number, like project/db/. Ids are free-form
# strings to Alembic; only down_revision decides the order.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Put the project directory on sys.path (the bazaar package is installed in the
# venv anyway; this lets env.py import local helpers in a plain checkout).
prepend_sys_path = .
path_separator = os

# Timestamps in the generated files.
timezone = UTC

[post_write_hooks]
# Format and lint every generated revision with ruff, like the rest of the code.
hooks = ruff_fix, ruff_format
# (type = module runs `python -m ruff` with the interpreter that runs alembic.)
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

# Logging configuration (used by the `alembic` command line only)
[loggers]
keys = root,sqlalchemy,alembic,bazaar

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# INFO here logs every SQL statement Alembic sends (very useful while learning)
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_bazaar]
# bazaar.migrate: backfill progress and other helper messages
level = INFO
handlers =
qualname = bazaar

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
