# =============================================================================
# HAProxy in front of the Patroni cluster.
#   :5000  read-write  -> only the node whose  GET /primary  returns 200
#   :5001  read-only   -> every node whose     GET /replica  returns 200
#   :7000  stats page
# HAProxy does not understand the Postgres protocol at all: it is a plain TCP
# proxy ("mode tcp"). It learns who is the leader by asking Patroni over HTTP.
# =============================================================================
global
    maxconn 1000

defaults
    mode tcp
    log global
    retries 2
    timeout connect 4s
    timeout client  30m     # long-lived idle Postgres sessions are normal
    timeout server  30m
    timeout check   2s

# Docker's embedded DNS, so HAProxy can (re)resolve m20-pgN after a container restarts.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5000
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # inter 1s : check every second
    # fall 2   : 2 failed checks -> DOWN; rise 1 : 1 good check -> UP
    # on-marked-down shutdown-sessions : kill open client connections to a node
    #   the moment it stops being primary, so nobody keeps writing to an old leader
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 m20-pg1:5432 check port 8008
    server pg2 m20-pg2:5432 check port 8008
    server pg3 m20-pg3:5432 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 m20-pg1:5432 check port 8008
    server pg2 m20-pg2:5432 check port 8008
    server pg3 m20-pg3:5432 check port 8008
