# Module 15 TLS lab: pg_hba.conf
#
# PostgreSQL reads this file top to bottom and uses the FIRST line whose
# type, database, user and address all match the connection attempt. Nothing
# falls through: if that line's method fails (wrong password, bad
# certificate), the connection is refused; later lines are never tried.
# No line matches at all -> refused as well.
#
# After editing: docker compose exec db psql -U postgres -c 'SELECT pg_reload_conf()'
# Check for typos: SELECT * FROM pg_hba_file_rules WHERE error IS NOT NULL;

# TYPE      DATABASE   USER         ADDRESS        METHOD

# Unix socket inside the container: only the OS user "postgres" as the
# database user "postgres" (the image's entrypoint needs this to initialize).
local       all        postgres                    peer
local       all        all                         reject

# No unencrypted TCP at all, for anybody.
hostnossl   all        all          0.0.0.0/0      reject

# alice proves who she is with a client certificate (CN=alice), no password.
hostssl     lab        alice        0.0.0.0/0      cert

# A role whose password was stored as an md5 hash (section 13.4 of the theory).
hostssl     lab        legacy       0.0.0.0/0      md5

# Every member of the group lab_users: password, SCRAM only.
hostssl     lab        +lab_users   0.0.0.0/0      scram-sha-256

# The administrator, over TLS, with a password.
hostssl     all        postgres     0.0.0.0/0      scram-sha-256
