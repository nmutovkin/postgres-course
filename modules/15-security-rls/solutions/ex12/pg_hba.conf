# Exercise 12: the lab's pg_hba.conf, hardened.
# TYPE      DATABASE   USER         ADDRESS        METHOD

# Administration only through the socket inside the container, as OS user postgres.
local       all        postgres                    peer
local       all        all                         reject

# Plain TCP is refused for everyone, before any other rule can match.
hostnossl   all        all          all            reject

# The superuser never logs in over the network (rule order: this must come
# before any line that could match postgres).
hostssl     all        postgres     all            reject

# alice: client certificate only.
hostssl     lab        alice        all            cert

# reporting: password (SCRAM), and only from a network the server is attached to.
hostssl     lab        reporting    samenet        scram-sha-256

# Members of lab_users (app, and alice from above): SCRAM. legacy now as well,
# after its password was re-hashed; the md5 line is gone.
hostssl     lab        +lab_users,legacy  all      scram-sha-256
