;; PgBouncer configuration for the module 17 lab.
;; NOTE: PgBouncer does not allow comments at the end of a value line.
;; Lines starting with ; are comments.

[databases]
;; Client connects to "bench"          -> transaction pooling (the global default below)
bench         = host=pg port=5432 dbname=bench
;; Client connects to "bench_session"  -> session pooling, same real database
bench_session = host=pg port=5432 dbname=bench pool_mode=session
;; Client connects to "bench_tiny"     -> transaction pooling with ONE server connection,
;; so every client shares the same backend. Used to make state leaks deterministic.
bench_tiny    = host=pg port=5432 dbname=bench pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Clients authenticate to PgBouncer with SCRAM; PgBouncer then logs in to
;; PostgreSQL with the same user/password taken from auth_file.
;; (A plain-text userlist is fine for a lab; in production use auth_query
;; or SCRAM secrets copied from pg_authid.)
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
;; client sockets PgBouncer accepts (cheap)
max_client_conn = 2000
;; server connections per (database, user) pair
default_pool_size = 20
reserve_pool_size = 0
;; 0 = unlimited (bounded by pool sizes)
max_db_connections = 0

;; Protocol-level prepared statement tracking (PgBouncer 1.21+).
;; 0 disables it; we start enabled and switch it off during the lab.
max_prepared_statements = 200

;; In session mode, run DISCARD ALL when a client disconnects so the next
;; client gets a clean backend. (Ignored in transaction mode.)
server_reset_query = DISCARD ALL

;; psql and pgbench send these on connect; ignore rather than reject them.
ignore_startup_parameters = extra_float_digits,options

admin_users = postgres
stats_users = app

log_connections = 0
log_disconnections = 0
