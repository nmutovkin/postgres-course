# pgBackRest configuration for the Module 18 lab.
# The repository lives on the m18-lab_pgbackrest volume; in production it
# would be another host or an object store (S3/GCS/Azure), never the DB host.

[global]
repo1-path=/var/lib/pgbackrest
# Keep 2 full backups (and everything that depends on them).
repo1-retention-full=2
# Compress backups and archived WAL with zstd.
compress-type=zst
compress-level=3
# Ask the server for an immediate checkpoint instead of waiting for the next one.
start-fast=y
# Parallel copy/compress processes.
process-max=2
log-level-console=info
log-level-file=detail

[global:archive-push]
compress-level=3

# One "stanza" = one PostgreSQL cluster being backed up.
[bazaar]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
